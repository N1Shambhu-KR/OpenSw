name: Build OpenSw Android APK

on:
  push:
    branches:
      - thor-lab
      - main
  workflow_dispatch:

jobs:
  build-opensw:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout OpenSw repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          link-to-sdk: true

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake ccache pkg-config glslang-tools

      - name: Build OpenSw Release APK
        working-directory: src/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleOpenSwRelease --stacktrace

      - name: Upload OpenSw APK
        uses: actions/upload-artifact@v4
        with:
          name: opensw-arm64-release
          path: src/android/app/build/outputs/apk/openSw/release/*.apk
          
